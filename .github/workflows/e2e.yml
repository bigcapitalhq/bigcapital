name: E2E
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  test_e2e:
    runs-on: ubuntu-24.04
    name: Playwright tests
    timeout-minutes: 20

    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigcapital_system
          MYSQL_USER: bigcapital
          MYSQL_PASSWORD: bigcapital
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18.16.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build

      - name: Create server .env file
        run: |
          cat > packages/server/.env << EOF
          # Database
          DB_HOST=127.0.0.1
          DB_USER=bigcapital
          DB_PASSWORD=bigcapital
          DB_ROOT_PASSWORD=root
          DB_CHARSET=utf8

          # System database
          SYSTEM_DB_NAME=bigcapital_system

          # Tenant databases
          TENANT_DB_NAME_PERFIX=bigcapital_tenant_

          # Application
          BASE_URL=http://localhost:3000
          APP_JWT_SECRET=test-app-jwt-secret

          # Sign-up
          SIGNUP_DISABLED=false

          # API throttling
          THROTTLE_GLOBAL_TTL=60000
          THROTTLE_GLOBAL_LIMIT=300
          THROTTLE_AUTH_TTL=60000
          THROTTLE_AUTH_LIMIT=30

          # Redis
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379

          # S3 (placeholder values for E2E tests)
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=test-access-key
          S3_SECRET_ACCESS_KEY=test-secret-key
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=test-bucket

          # Mail (placeholder values for E2E tests)
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_FROM_NAME=Bigcapital
          MAIL_FROM_ADDRESS=test@bigcapital.app
          EOF

      - name: Grant tenant database privileges
        run: |
          CID=$(docker ps -qf "ancestor=mariadb:10.6" | head -1)
          docker exec "$CID" mysql -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'bigcapital'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Run database migrations
        run: pnpm system:migrate:latest

      - name: Start server in background
        run: |
          cd packages/server && pnpm start &
          sleep 10
        env:
          NODE_ENV: production

      - name: Start webapp in background
        run: |
          cd packages/webapp && VITE_REACT_QUERY_DEVTOOLS=false pnpm dev &
          sleep 10

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        run: pnpm run e2e:webapp
        env:
          PLAYWRIGHT_TEST_API_URL: http://localhost:3000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4000

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
