name: Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "archive/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [sandbox, uat]
        default: sandbox

# Required for actions/checkout + GHCR push via GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

# Serialize deploys per environment so two pushes in quick succession don't
# fight over the same VPS. Don't cancel in-progress runs — interrupting a
# half-done docker compose pull leaves things in a worse state than waiting.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'sandbox' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: crxnit

jobs:
  build-and-scan:
    name: Build & scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, webapp]
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - id: sha
        name: Compute short SHA
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:latest
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan ${{ matrix.service }} (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          # Runner is amd64; image is arm64-only. Force Trivy to fetch the arm64 manifest.
          TRIVY_PLATFORM: linux/arm64

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'sandbox' }}
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    steps:
      - id: sha
        name: Compute short SHA
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote deploy
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              "${{ secrets.VPS_HOST }}" \
              "${{ steps.sha.outputs.short }} ${{ steps.sha.outputs.short }}"
