# WARNING!
# This is a development version of THE Bigcapital docker-compose.yml file.
# Avoid using this file in your production environment.
# We're exposing here sensitive ports and mounting code volumes for rapid development and debugging of the server stack.

version: '3.3'

services:
  mariadb:
    build:
      context: ./docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - '3306'
    ports:
      - '3306:3306'
    deploy:
      restart_policy:
        condition: unless-stopped

  redis:
    build:
      context: ./docker/redis
    expose:
      - '6379'
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    deploy:
      restart_policy:
        condition: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:7
    ports:
      - '9000:3000'

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # With an empty password, the image entrypoint restricts the
      # `default` user to localhost connections only, which would reject
      # connections through the published port. Setting the entrypoint's
      # CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT input routes to the
      # unrestricted user setup instead. Set a non-empty
      # CLICKHOUSE_PASSWORD in .env to protect the user in production.
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-bigcapital_analytics}
    expose:
      - '8123'
      - '9000'
    ports:
      - '8123:8123'
    volumes:
      - clickhouse:/var/lib/clickhouse
    deploy:
      restart_policy:
        condition: unless-stopped

  garage:
    image: dxflrs/garage:v1.3.1
    container_name: bigcapital-garage
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml
      - garage:/var/lib/garage
    ports:
      - '3900:3900'
      - '3903:3903'
    expose:
      - '3900'
      - '3903'
    deploy:
      restart_policy:
        condition: unless-stopped

  # Applies the cluster layout and creates the bucket and access key on first
  # start. Exits once Garage is ready and is safe to re-run.
  garage-init:
    image: curlimages/curl:8.11.1
    container_name: bigcapital-garage-init
    depends_on:
      - garage
    restart: 'no'
    entrypoint: ['sh', '/init.sh']
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - GARAGE_LOCAL_ZONE=${GARAGE_LOCAL_ZONE:-dc1}
      - GARAGE_CAPACITY=${GARAGE_CAPACITY:-10000000000}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro

# Volumes
volumes:
  mysql:
    name: bigcapital_dev_mysql
    driver: local

  redis:
    name: bigcapital_dev_redis
    driver: local

  garage:
    name: bigcapital_dev_garage
    driver: local

  clickhouse:
    name: bigcapital_dev_clickhouse
    driver: local
