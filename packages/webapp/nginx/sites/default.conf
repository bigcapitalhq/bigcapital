server {
    listen 80 default_server;

    # CSV imports / attachments can exceed nginx's 1MB default.
    client_max_body_size 50m;

    root /usr/share/nginx/html;

    # API requests are proxied to the internal NestJS server so the SPA can keep
    # calling the API on its own origin (see ApiService.tsx).
    location /api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO endpoint exposed by the server (path '/socket').
    location /socket {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri /index.html;
    }
}