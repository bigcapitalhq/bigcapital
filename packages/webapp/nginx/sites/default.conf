server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # index.html names the current bundle, so browsers must revalidate it on every load;
    # without this they keep a heuristic copy and run the previous build after an upgrade.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # vite fingerprints every file under /assets, so a changed file always gets a new name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable"; # success only, so a 404 is never pinned
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
