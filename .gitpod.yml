image: gitpod/workspace-node-22

tasks:
  - name: Init
    before: npm install --global pnpm@9
    init: |
      pnpm install --frozen-lockfile &&
      cp .env.example .env &&
      docker-compose up -d &&
      pnpm run build:server &&
      pnpm run system:migrate:latest
    command: | 
      docker-compose up -d &&
      pnpm run dev

ports:
  - port: 4000
    visibility: public
    onOpen: open-preview
  - port: 3000
    visibility: public
    onOpen: ignore
  - port: 3306
    visibility: public
    onOpen: ignore
